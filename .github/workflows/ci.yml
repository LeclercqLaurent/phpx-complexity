name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The authoritative gate: locked dependencies (composer.lock is versioned), so
  # exactly the CS-Fixer and PHPStan versions the project deliberately pinned to
  # the patch level. It runs on the development version of PHP.
  qa:
    name: QA gate (PHP 8.4, locked dependencies)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: PHP-CS-Fixer (PSR-12)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan (level 9)
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit and coverage floor
        run: |
          vendor/bin/phpunit --coverage-clover var/clover.xml
          php tools/coverage-gate.php var/clover.xml 90

      - name: Dogfooding, the tool audits itself in ratchet mode
        run: php bin/phpx-complexity src/ --baseline=baseline.json --fail-on-new

  # Proof that the advertised range (PHP >= 8.2) really holds. The lock file is no
  # use here: resolved under 8.4, it drags in Symfony components requiring 8.4.1
  # through PHP-CS-Fixer. So we resolve for the platform under test, and run only
  # what engages the library itself, never the gate, which would otherwise be at
  # the mercy of an unpinned tool version.
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Resolve dependencies for this platform
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: Dogfooding, the tool audits itself in ratchet mode
        run: php bin/phpx-complexity src/ --baseline=baseline.json --fail-on-new
